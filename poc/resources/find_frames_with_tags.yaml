names:
  0: vertical_container_number
  1: horizontal_container_number
  2: container_corner
  3: container
  4: railcar_bogie
  5: railcar_number_two_lines
  6: railcar_gap
  7: railcar_number_four_lines
  8: railcar_number_one_line

model:
  confidence_threshold: 0.40
  batch: 100
  classes: [0,1,3,4,5,6,7,8]

extension:
  input: .mp4
  output: .jpg

image_size:
  width: 1920
  height: 1080

empty_image_step: 50

batch_filters:
  efficientnet:
    active: False

detections_filters:
  any_below_threshold:
    active: False
    value: 0.8
  tracking_patience:
    active: True
    patience: 100
    classes: [0,1,5,7,8]

output:
  original_image:
    active: True
  cropped:
    active: True
    classes: [0,1,5,7,8]
  bounding_box_image:
    active: False
    classes: [0,1,3,4,5,6,7,8]
